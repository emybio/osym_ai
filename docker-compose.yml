version: "3.9"

services:
  db:
    image: postgres:18
    container_name: osym_db
    environment:
      POSTGRES_DB: osym
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: osym
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: osym_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    container_name: osym_backend
    command: >
      bash -c "
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000"
    env_file:
      - ./backend/.env.docker
    environment:
      DJANGO_ENV=docker
    volumes:
      - ./backend:/app
      - ./backend/media:/app/media
      - ./backend/chroma_yks_pdf:/app/chroma_yks_pdf
      - ./backend/chroma_past:/app/chroma_past
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
    container_name: osym_frontend
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    working_dir: /app
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_URL: http://backend:8000
    depends_on:
      - backend

  celery-worker:
    build:
      context: ./backend
    container_name: osym_celery_worker
    command: celery -A osym_ai worker --loglevel=info --queues=pdf_processing,default
    env_file:
      - ./backend/.env.docker
    environment:
      DJANGO_ENV=docker
    volumes:
      - ./backend:/app
      - ./backend/media:/app/media
      - ./backend/chroma_yks_pdf:/app/chroma_yks_pdf
      - ./backend/chroma_past:/app/chroma_past
    depends_on:
      - backend
      - redis

  celery-beat:
    build:
      context: ./backend
    container_name: osym_celery_beat
    command: celery -A osym_ai beat --loglevel=info
    env_file:
      - ./backend/.env.docker
    environment:
      DJANGO_ENV=docker
    volumes:
      - ./backend:/app
    depends_on:
      - backend
      - redis

volumes:
  postgres-data:
