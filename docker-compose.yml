version: "3.9"
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: osym
      POSTGRES_USER: postgres
      POSTGRES_DB: osym
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/

  redis:
    image: redis:7

  backend:
    build: ./backend
    command: >
      bash -c "python manage.py migrate &&
               python manage.py runserver 0.0.0.0:8000"
    environment:
      ZAI_API_KEY: ${ZAI_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      POSTGRES_DB: ${POSTGRES_DB:-osym}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-osym}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      IGNORE_SSL: ${IGNORE_SSL:-True}
      NODE_TLS_REJECT_UNAUTHORIZED: ${NODE_TLS_REJECT_UNAUTHORIZED:-0}
      ZAI_MODEL: ${ZAI_MODEL:-glm-4.6}
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ./backend:/app # backend kodları canlı izlenir
      - /app/__pychache__/ # 🔹 Kod değişiklikleri anında yansır
    ports:
      - "8000:8000"
    
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
    command: [ "npm", "run", "dev", "--", "--host", "0.0.0.0" ] # Vite dev server çalışır
    ports:
      - "5173:5173" # Vite varsayılan port
    volumes:
      - ./frontend:/app # canlı kod izleme
      - /app/node_modules # bağımlılıklar container içinde kalır
    environment:
      - CHOKIDAR_USEPOLLING=true # Docker'da dosya değişimlerini algılar
      - VITE_API_URL=http://backend:8000 # Backend API URL
    
    working_dir: /app
    depends_on:
      - backend

volumes:
  postgres-data:
